intro: |
  <a id="video"></a>
  bobliu is a hobby kernel written to learn how every layer fits together, following the [OSDev "Creating an Operating System"](https://wiki.osdev.org/Creating_an_Operating_System) roadmap and then pushed well past it.
  No Linux, no borrowed kernel: its own bootstrap, interrupts, paging, allocators, scheduler, VFS, filesystems, libc, shell and coreutils. It boots from GRUB into a **userland shell** with tab completion, history, pipes, redirection, scripting,
  `vi`, a Lua 5.1 interpreter, a port of the real Neovim, and a Doom port. A fresh clone builds a **{{ n.iso.text }}** bootable ISO with **{{ n.programs.text }} programs** in about {{ n.secs.text }} on a laptop.

  <p align="center"><img src="docs/img/doom.png" width="640" alt="Doom (Freedoom) running on bobliu in QEMU"></p>
  <p align="center"><sub>Freedoom running as a ring 3 process on bobliu: framebuffer out, raw scancodes in. Screenshot taken from this repo's own ISO under QEMU.</sub></p>

video:
  url: ""
  caption: "Explainer video (voice-over and captions): what bobliu is, how it is built, what ships, and the limits"
  mp4: video/bobliu_os_explainer.mp4
  gif: video/preview.gif
  srt: video/bobliu_os_explainer.srt
  poster: video/poster.png
  out_dir: video/.render
  fps: 24
  max_mb: 22
  render_crf: 18
  concurrency: 4
  music: true
  voice: {engine: openai, voice: alloy, model: gpt-4o-mini-tts, tempo: 1.2}
  scenes:
    - type: title
      title: bobliu OS
      subtitle: From _start to DOOM
      chips: [i686, GRUB, C and assembly, no Linux]
      say: "bobliu O S: a from scratch thirty two bit x86 operating system. It boots, forks, pipes, runs Lua, and plays DOOM."
    - type: problem
      heading: "Why build an OS?"
      bullets:
        - "To learn how every layer fits together"
        - "Bootstrap, interrupts, paging, scheduler, filesystems"
        - "Then libc, a shell, and real programs on top"
        - "No Linux, no borrowed kernel, no glibc"
      say: "bobliu is a hobby kernel written to learn how every layer fits together. Its own bootstrap, interrupts, paging, allocators, scheduler, file systems, libc, shell and core utilities. No Linux, no borrowed kernel, no glibc."
    - type: architecture
      diagram: layers
      heading: "The layers"
      say: "User programs run in ring three on top of the libc. They enter the kernel through int eighty with Linux i three eighty six syscall numbers. The kernel has a process layer with a preemptive scheduler and copy on write fork, a file system layer behind a V F S, a memory layer, and drivers."
    - type: stat
      number: loc_all
      kicker: "lines of C and assembly written for this repo"
      label: "lines"
      sub: "kernel, libc and user programs; vendored Doom, Lua and Freedoom are extra"
      say: "That adds up to {{ n.loc_all.numtext }} lines of C and assembly: {{ n.loc_k.numtext }} in the kernel, {{ n.loc_l.numtext }} in the libc, which includes a vendored math library, and {{ n.loc_u.numtext }} in user programs."
    - type: chart
      chart: sizes
      say: "A fresh clone builds a bootable I S O of {{ n.iso.numtext }} megabytes. The kernel itself is {{ n.kernel_kb.numtext }} kilobytes. Most of the initial ramdisk is the Freedoom game data."
    - type: cards
      heading: "What ships"
      cards:
        - {title: "Kernel", sub: "ring 0", lines: ["COW fork, preemptive scheduler", "threads, signals, pipes, VFS", "bobfs on an ATA disk"]}
        - {title: "Userland", sub: "{{ n.programs.text }} programs", lines: ["own libc, sh with history and tab completion", "vi, kilo, Lua 5.1", "{{ n.tests.text }} in-OS test programs"]}
        - {title: "Big ports", sub: "running on bobliu", lines: ["Doom (doomgeneric + Freedoom)", "Neovim 0.10.4, cross-built", "slow to start under QEMU"]}
      footer: "Single core, VGA and linear framebuffer, PS/2 keyboard"
      say: "What ships: a kernel with copy on write fork, a preemptive scheduler, threads, signals, pipes and its own file system. A userland of {{ n.programs.numtext }} programs, with a shell, vi, the kilo editor and Lua. And two big ports: Doom, and the real Neovim, which is slow to start under QEMU."
    - type: terminal
      heading: "Inside bobliu"
      lines:
        - {cmd: "echo hi | tr a-z A-Z"}
        - {out: "HI"}
        - {cmd: "lua -e \"for i=1,3 do print(i, i*i) end\""}
        - {out: "1       1"}
        - {out: "2       4"}
        - {out: "3       9"}
        - {cmd: "doom -warp 1 1 -skill 2"}
      say: "Pipes work, Lua runs, and the finale is Doom, launched from the shell."
    - type: caveats
      heading: "Honest limits"
      bullets:
        - "Single core, at most 16 processes, 16 fds each"
        - "bobfs: 128 files, no cache, no journal"
        - "Kernel-mode exceptions halt the machine"
        - "No networking, sound, USB or serial console"
      say: "The limits. Single core, at most sixteen processes. The bobfs file system has no cache and no journal. Kernel mode exceptions halt the machine. There is no networking, sound or U S B. It is a learning O S, not a Linux replacement."
    - type: end
      title: bobliu OS
      subtitle: "./iso.sh then ./qemu.sh"
      say: "Clone the repo, run iso dot s h, then qemu dot s h, and boot it."

